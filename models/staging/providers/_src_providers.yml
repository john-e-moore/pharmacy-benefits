version: 2

sources:
  - name: providers
    database: pharmacy_benefits_raw
    schema: providers
    tables:
      - name: raw_providers
        config:
          freshness:
            warn_after:
              count: 3
              period: hour
            error_after:
              count: 7
              period: hour
          loaded_at_field: loaded_at
        columns:
          - name: provider_id
            data_type: number
            description: Unique identifier for each prescribing provider.
            data_tests:
              - unique
              - not_null
          - name: npi
            data_type: varchar
            description: National Provider Identifier (NPI) for the prescriber.
            data_tests:
              - unique
              - not_null
          - name: provider_last_name
            data_type: varchar
            description: Last name of the prescribing provider.
            data_tests:
              - not_null
          - name: specialty
            data_type: varchar
            description: Clinical specialty of the prescribing provider.
            data_tests:
              - not_null
          - name: state
            data_type: varchar
            description: Two-letter state code where the provider practices.
            data_tests:
              - not_null
          - name: loaded_at
            data_type: timestamp_tz
            description: Timestamp when the provider record was loaded into the raw layer.
            data_tests:
              - not_null
