version: 2

sources:
  - name: pharmacies
    database: pharmacy_benefits_raw
    schema: pharmacies
    tables:
      - name: raw_pharmacies
        config:
          freshness:
            warn_after:
              count: 3
              period: hour
            error_after:
              count: 7
              period: hour
          loaded_at_field: loaded_at
        columns:
          - name: pharmacy_id
            data_type: number
            description: Unique identifier for each dispensing pharmacy.
            data_tests:
              - unique
              - not_null
          - name: pharmacy_name
            data_type: varchar
            description: Legal or trade name of the pharmacy location.
            data_tests:
              - not_null
          - name: ncpdp_id
            data_type: varchar
            description: National Council for Prescription Drug Programs (NCPDP) provider identifier.
            data_tests:
              - unique
              - not_null
          - name: state
            data_type: varchar
            description: Two-letter state code where the pharmacy is located.
            data_tests:
              - not_null
          - name: network_status
            data_type: varchar
            description: Indicates whether the pharmacy participates in the plan network.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['in_network', 'out_of_network']
          - name: loaded_at
            data_type: timestamp_tz
            description: Timestamp when the pharmacy record was loaded into the raw layer.
            data_tests:
              - not_null
